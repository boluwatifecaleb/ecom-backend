services:
  postgres:
    image: postgres:16
    container_name: ecom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecom_user
      POSTGRES_PASSWORD: Soremi2003
      POSTGRES_DB: ecom_DB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: